<!doctype html>
<!-- Plantilla de public/og-default.png (1200 × 630): abrir en Chrome a 1200 × 630 y hacer captura.
     Rehacerla cuando llegue el logo definitivo. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#131517;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F1ECE4}
.frame{position:absolute;inset:36px;border:1px solid rgba(212,188,150,.28)}
img{width:132px;height:132px;object-fit:contain}
.brand{margin-top:34px;font-family:'Cormorant Garamond',serif;font-size:92px;line-height:1;letter-spacing:.02em}
.rule{width:72px;height:1px;background:rgba(212,188,150,.6);margin:30px 0 26px}
.firm{font-family:'DM Sans',sans-serif;font-size:19px;letter-spacing:.32em;text-transform:uppercase;color:#D4BC96}
.place{margin-top:16px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:#B9B2A8}
</style></head><body><div class="wrap"><div class="frame"></div>
<img src="../public/monogram-temp.png" alt="">
<div class="brand">SBS Abogados</div><div class="rule"></div>
<div class="firm">Solano Bermúdez &amp; Solano</div>
<div class="place">Costa Rica</div></div></body></html>
